name: TesterArmy Mobile Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  fingerprint:
    name: Calculate app fingerprints
    type: fingerprint
    environment: preview

  get_ios_build:
    name: Find matching iOS Simulator build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: testerarmy-ios-simulator
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  get_android_build:
    name: Find matching Android app build
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: testerarmy-android-apk
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      wait_for_in_progress: true

  build_ios:
    name: Build iOS Simulator app
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    environment: preview
    params:
      platform: ios
      profile: testerarmy-ios-simulator

  build_android:
    name: Build Android app
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    environment: preview
    params:
      platform: android
      profile: testerarmy-android-apk

  upload_ios_app:
    name: Upload iOS app to TesterArmy
    after: [get_ios_build, build_ios]
    if: ${{ after.get_ios_build.outputs.build_id || after.build_ios.outputs.build_id }}
    environment: preview
    outputs:
      app_id: ${{ fromJSON(steps.upload_app.outputs.upload_result).uploadedAppId }}
      project_id: ${{ steps.upload_app.outputs.project_id }}
    steps:
      - uses: eas/checkout

      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ after.get_ios_build.outputs.build_id || after.build_ios.outputs.build_id }}
          extensions:
            - app

      - name: Upload app
        id: upload_app
        run: |
          set -euo pipefail

          APP_PATH="${{ steps.download_build.outputs.artifact_path }}"

          mkdir -p .testerarmy

          npx --yes testerarmy@latest upload-app \
            --app-path "$APP_PATH" \
            --project "$TESTERARMY_PROJECT_ID" \
            --remove-after 86400 \
            --output .testerarmy/upload.json

          set-output upload_result "$(tr -d '\n' < .testerarmy/upload.json)"
          set-output project_id "$TESTERARMY_PROJECT_ID"

  upload_android_app:
    name: Upload Android app to TesterArmy
    after: [get_android_build, build_android]
    if: ${{ after.get_android_build.outputs.build_id || after.build_android.outputs.build_id }}
    environment: preview
    outputs:
      app_id: ${{ fromJSON(steps.upload_app.outputs.upload_result).uploadedAppId }}
      project_id: ${{ steps.upload_app.outputs.project_id }}
    steps:
      - uses: eas/checkout

      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ after.get_android_build.outputs.build_id || after.build_android.outputs.build_id }}
          extensions:
            - apk

      - name: Upload app
        id: upload_app
        run: |
          set -euo pipefail

          APP_PATH="${{ steps.download_build.outputs.artifact_path }}"

          mkdir -p .testerarmy

          npx --yes testerarmy@latest upload-app \
            --app-path "$APP_PATH" \
            --project "$TESTERARMY_PROJECT_ID" \
            --remove-after 86400 \
            --output .testerarmy/upload.json

          set-output upload_result "$(tr -d '\n' < .testerarmy/upload.json)"
          set-output project_id "$TESTERARMY_PROJECT_ID"

  run_ios_tests:
    name: Run iOS TesterArmy tests
    needs: [upload_ios_app]
    environment: preview
    steps:
      - uses: eas/checkout

      - name: Run tests
        run: |
          set -euo pipefail

          APP_ID="${{ needs.upload_ios_app.outputs.app_id }}"
          COMMIT_SHA="${{ github.sha }}"
          EVENT_NAME="${{ github.event_name }}"
          PR_NUMBER="${{ github.event.pull_request.number || '' }}"
          TIMEOUT_MS="1800000"
          POLL_INTERVAL_SECONDS="10"

          mkdir -p .testerarmy

          args=(
            ci
            --group "$TESTERARMY_GROUP_ID"
            --project "$TESTERARMY_PROJECT_ID"
            --platform ios
            --app-id "$APP_ID"
            --commit-sha "$COMMIT_SHA"
            --timeout "$TIMEOUT_MS"
            --poll-interval-seconds "$POLL_INTERVAL_SECONDS"
            --output .testerarmy/ci-result.json
          )

          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
            args+=(--pr-number "$PR_NUMBER")
          fi

          npx --yes testerarmy@latest "${args[@]}"

  run_android_tests:
    name: Run Android TesterArmy tests
    needs: [upload_android_app]
    environment: preview
    steps:
      - uses: eas/checkout

      - name: Run tests
        run: |
          set -euo pipefail

          APP_ID="${{ needs.upload_android_app.outputs.app_id }}"
          COMMIT_SHA="${{ github.sha }}"
          EVENT_NAME="${{ github.event_name }}"
          PR_NUMBER="${{ github.event.pull_request.number || '' }}"
          TIMEOUT_MS="1800000"
          POLL_INTERVAL_SECONDS="10"

          mkdir -p .testerarmy

          args=(
            ci
            --group "$TESTERARMY_GROUP_ID"
            --project "$TESTERARMY_PROJECT_ID"
            --platform android
            --app-id "$APP_ID"
            --commit-sha "$COMMIT_SHA"
            --timeout "$TIMEOUT_MS"
            --poll-interval-seconds "$POLL_INTERVAL_SECONDS"
            --output .testerarmy/ci-result.json
          )

          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
            args+=(--pr-number "$PR_NUMBER")
          fi

          npx --yes testerarmy@latest "${args[@]}"

  run_ios_dynamic_agent:
    name: Run iOS TesterArmy dynamic agent
    needs: [upload_ios_app]
    if: ${{ github.event_name == 'pull_request' }}
    environment: preview
    env:
      APP_ID: ${{ needs.upload_ios_app.outputs.app_id }}
      COMMIT_SHA: ${{ github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      PR_TITLE: ${{ github.event.pull_request.title || '' }}
      PR_DESCRIPTION: ${{ github.event.pull_request.body || '' }}
      BASE_BRANCH: ${{ github.event.pull_request.base.ref || '' }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref || '' }}
    steps:
      - uses: eas/checkout

      - name: Run dynamic PR agent
        run: |
          set -euo pipefail

          if [ "${TESTERARMY_DYNAMIC_AGENT_ENABLED:-true}" = "false" ]; then
            echo "TesterArmy dynamic agent is disabled because TESTERARMY_DYNAMIC_AGENT_ENABLED=false."
            exit 0
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request number found; skipping TesterArmy dynamic agent."
            exit 0
          fi

          mkdir -p .testerarmy
          rm -f .testerarmy/dynamic-result.json

          dynamic_pr_title="$PR_TITLE"
          if [ -z "$dynamic_pr_title" ]; then
            dynamic_pr_title="Pull request #$PR_NUMBER"
          fi

          args=(
            pr
            run-dynamic
            --project "$TESTERARMY_PROJECT_ID"
            --platform ios
            --app-id "$APP_ID"
            --pr-number "$PR_NUMBER"
            --pr-title "$dynamic_pr_title"
            --commit-sha "$COMMIT_SHA"
            --output .testerarmy/dynamic-result.json
          )

          if [ -n "$PR_DESCRIPTION" ]; then
            args+=(--pr-description "$PR_DESCRIPTION")
          fi

          if [ -n "$BASE_BRANCH" ]; then
            args+=(--base-branch "$BASE_BRANCH")
          fi

          if [ -n "$HEAD_BRANCH" ]; then
            args+=(--head-branch "$HEAD_BRANCH")
          fi

          npx --yes testerarmy@latest "${args[@]}"

  run_android_dynamic_agent:
    name: Run Android TesterArmy dynamic agent
    needs: [upload_android_app]
    if: ${{ github.event_name == 'pull_request' }}
    environment: preview
    env:
      APP_ID: ${{ needs.upload_android_app.outputs.app_id }}
      COMMIT_SHA: ${{ github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      PR_TITLE: ${{ github.event.pull_request.title || '' }}
      PR_DESCRIPTION: ${{ github.event.pull_request.body || '' }}
      BASE_BRANCH: ${{ github.event.pull_request.base.ref || '' }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref || '' }}
    steps:
      - uses: eas/checkout

      - name: Run dynamic PR agent
        run: |
          set -euo pipefail

          if [ "${TESTERARMY_DYNAMIC_AGENT_ENABLED:-true}" = "false" ]; then
            echo "TesterArmy dynamic agent is disabled because TESTERARMY_DYNAMIC_AGENT_ENABLED=false."
            exit 0
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request number found; skipping TesterArmy dynamic agent."
            exit 0
          fi

          mkdir -p .testerarmy
          rm -f .testerarmy/dynamic-result.json

          dynamic_pr_title="$PR_TITLE"
          if [ -z "$dynamic_pr_title" ]; then
            dynamic_pr_title="Pull request #$PR_NUMBER"
          fi

          args=(
            pr
            run-dynamic
            --project "$TESTERARMY_PROJECT_ID"
            --platform android
            --app-id "$APP_ID"
            --pr-number "$PR_NUMBER"
            --pr-title "$dynamic_pr_title"
            --commit-sha "$COMMIT_SHA"
            --output .testerarmy/dynamic-result.json
          )

          if [ -n "$PR_DESCRIPTION" ]; then
            args+=(--pr-description "$PR_DESCRIPTION")
          fi

          if [ -n "$BASE_BRANCH" ]; then
            args+=(--base-branch "$BASE_BRANCH")
          fi

          if [ -n "$HEAD_BRANCH" ]; then
            args+=(--head-branch "$HEAD_BRANCH")
          fi

          npx --yes testerarmy@latest "${args[@]}"
