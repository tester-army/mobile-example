name: Test Mobile App Example

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build_ios:
    name: Build iOS Simulator app
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Cache built .app
        id: app-cache
        uses: actions/cache@v4
        with:
          path: .build/testerarmy.app
          key: ios-app-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', 'app/**', 'assets/**') }}

      - name: Build iOS Simulator app
        if: steps.app-cache.outputs.cache-hit != 'true'
        id: build
        uses: ./.github/actions/build-ios-simulator-app

      - name: Copy .app to cache path
        if: steps.app-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .build
          cp -R "${{ steps.build.outputs.app_path }}" .build/testerarmy.app

      - name: Upload .app artifact
        uses: actions/upload-artifact@v5
        with:
          name: testerarmy-simulator-app
          path: .build/testerarmy.app
          retention-days: 1

  build_android:
    name: Build Android app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (Android)
        env:
          CI: "true"
        run: npx expo prebuild --platform android --no-install

      - name: Build Android app
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Copy APK to artifact path
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          if [[ -z "${APK_PATH:-}" || ! -f "$APK_PATH" ]]; then
            echo "Could not find a release APK under android/app/build/outputs/apk/release"
            exit 1
          fi
          mkdir -p .build
          cp "$APK_PATH" .build/testerarmy.apk

      - name: Upload Android app artifact
        uses: actions/upload-artifact@v5
        with:
          name: testerarmy-android-apk
          path: .build/testerarmy.apk
          retention-days: 1

  upload_ios:
    name: Upload iOS app to TesterArmy
    needs: build_ios
    runs-on: ubuntu-latest
    outputs:
      app_id: ${{ steps.mobile.outputs.app_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download .app artifact
        uses: actions/download-artifact@v5
        with:
          name: testerarmy-simulator-app
          path: .build/testerarmy.app

      - name: Upload app
        id: mobile
        # TODO: Switch back to @main after tester-army/mobile-github-action#4 merges.
        uses: tester-army/mobile-github-action@36005f70a05f421b1c5e0c9535b651cd1e6ed00b
        with:
          mode: upload
          app_path: .build/testerarmy.app
          api_key: ${{ secrets.TESTERARMY_API_KEY }}
          project_id: ${{ secrets.TESTERARMY_PROJECT_ID }}
          remove_after: "86400"

  test_ios:
    name: Run iOS TesterArmy tests
    needs: upload_ios
    runs-on: ubuntu-latest

    steps:
      - name: Run TesterArmy tests
        id: mobile
        # TODO: Switch back to @main after tester-army/mobile-github-action#4 merges.
        uses: tester-army/mobile-github-action@36005f70a05f421b1c5e0c9535b651cd1e6ed00b
        with:
          mode: test
          app_id: ${{ needs.upload_ios.outputs.app_id }}
          platform: ios
          api_key: ${{ secrets.TESTERARMY_API_KEY }}
          project_id: ${{ secrets.TESTERARMY_PROJECT_ID }}
          group_id: ${{ secrets.TESTERARMY_GROUP_ID }}

      - name: Print overall status
        run: |
          echo "ios overall status: ${{ steps.mobile.outputs.overall_status }}"

  dynamic_ios:
    name: Run iOS TesterArmy dynamic agent
    needs: upload_ios
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Run dynamic PR agent
        id: mobile
        # TODO: Switch back to @main after tester-army/mobile-github-action#4 merges.
        uses: tester-army/mobile-github-action@36005f70a05f421b1c5e0c9535b651cd1e6ed00b
        with:
          mode: dynamic_agent
          app_id: ${{ needs.upload_ios.outputs.app_id }}
          platform: ios
          api_key: ${{ secrets.TESTERARMY_API_KEY }}
          project_id: ${{ secrets.TESTERARMY_PROJECT_ID }}

      - name: Print dynamic agent status
        run: |
          echo "ios dynamic agent status: ${{ steps.mobile.outputs.dynamic_agent_status }}"

  upload_android:
    name: Upload Android app to TesterArmy
    needs: build_android
    runs-on: ubuntu-latest
    outputs:
      app_id: ${{ steps.mobile.outputs.app_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download Android app artifact
        uses: actions/download-artifact@v5
        with:
          name: testerarmy-android-apk
          path: .build

      - name: Upload app
        id: mobile
        # TODO: Switch back to @main after tester-army/mobile-github-action#4 merges.
        uses: tester-army/mobile-github-action@36005f70a05f421b1c5e0c9535b651cd1e6ed00b
        with:
          mode: upload
          app_path: .build/testerarmy.apk
          api_key: ${{ secrets.TESTERARMY_API_KEY }}
          project_id: ${{ secrets.TESTERARMY_PROJECT_ID }}
          remove_after: "86400"

  test_android:
    name: Run Android TesterArmy tests
    needs: upload_android
    runs-on: ubuntu-latest

    steps:
      - name: Run TesterArmy tests
        id: mobile
        # TODO: Switch back to @main after tester-army/mobile-github-action#4 merges.
        uses: tester-army/mobile-github-action@36005f70a05f421b1c5e0c9535b651cd1e6ed00b
        with:
          mode: test
          app_id: ${{ needs.upload_android.outputs.app_id }}
          platform: android
          api_key: ${{ secrets.TESTERARMY_API_KEY }}
          project_id: ${{ secrets.TESTERARMY_PROJECT_ID }}
          group_id: ${{ secrets.TESTERARMY_GROUP_ID }}

      - name: Print overall status
        run: |
          echo "android overall status: ${{ steps.mobile.outputs.overall_status }}"

  dynamic_android:
    name: Run Android TesterArmy dynamic agent
    needs: upload_android
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Run dynamic PR agent
        id: mobile
        # TODO: Switch back to @main after tester-army/mobile-github-action#4 merges.
        uses: tester-army/mobile-github-action@36005f70a05f421b1c5e0c9535b651cd1e6ed00b
        with:
          mode: dynamic_agent
          app_id: ${{ needs.upload_android.outputs.app_id }}
          platform: android
          api_key: ${{ secrets.TESTERARMY_API_KEY }}
          project_id: ${{ secrets.TESTERARMY_PROJECT_ID }}

      - name: Print dynamic agent status
        run: |
          echo "android dynamic agent status: ${{ steps.mobile.outputs.dynamic_agent_status }}"
