name: Test Mobile App Example

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build iOS Simulator app
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build iOS Simulator app
        id: build
        uses: ./.github/actions/build-ios-simulator-app

      - name: Upload .app artifact
        uses: actions/upload-artifact@v5
        with:
          name: testerarmy-simulator-app
          path: ${{ steps.build.outputs.app_path }}
          retention-days: 1

  test:
    name: Run TesterArmy tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download .app artifact
        uses: actions/download-artifact@v5
        with:
          name: testerarmy-simulator-app
          path: app

      - name: Upload app and run TesterArmy tests
        id: mobile
        uses: ./.github/actions/testerarmy-mobile-ci
        with:
          app_path: app/testerarmy.app
          api_key: ${{ secrets.TESTERARMY_API_KEY }}
          project_id: ${{ secrets.TESTERARMY_PROJECT_ID }}
          webhook_url: ${{ secrets.TESTERARMY_WEBHOOK_URL }}
          delete_app_after_run: "true"
          remove_after: "3600"

      - name: Print overall status
        run: |
          echo "Overall status: ${{ steps.mobile.outputs.overall_status }}"
