name: Test Mobile App Example

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-mobile:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build iOS Simulator app
        id: build
        uses: ./.github/actions/build-ios-simulator-app

      - name: Upload app and run TesterArmy tests
        id: mobile
        uses: ./.github/actions/testerarmy-mobile-ci
        with:
          app_path: ${{ steps.build.outputs.app_path }}
          api_key: ${{ secrets.TESTERARMY_API_KEY }}
          project_id: ${{ secrets.TESTERARMY_PROJECT_ID }}
          webhook_url: ${{ secrets.TESTERARMY_WEBHOOK_URL }}
          delete_app_after_run: "true"
          remove_after: "3600"

      - name: Print overall status
        run: |
          echo "Overall status: ${{ steps.mobile.outputs.overall_status }}"
