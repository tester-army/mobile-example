name: TesterArmy Delete App
description: Deletes an uploaded TesterArmy mobile app.

inputs:
  api_key:
    description: TesterArmy API key.
    required: true
  project_id:
    description: TesterArmy project ID.
    required: true
  webhook_url:
    description: TesterArmy group webhook URL used to derive the API base.
    required: true
  app_id:
    description: Uploaded TesterArmy app ID to delete.
    required: true

runs:
  using: composite
  steps:
    - name: Delete app
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TESTERARMY_API_KEY: ${{ inputs.api_key }}
        TESTERARMY_PROJECT_ID: ${{ inputs.project_id }}
        TESTERARMY_WEBHOOK_URL: ${{ inputs.webhook_url }}
        TESTERARMY_APP_ID: ${{ inputs.app_id }}
      run: node --experimental-strip-types "$ACTION_PATH/delete-mobile-app.ts"
