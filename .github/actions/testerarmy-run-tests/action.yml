name: TesterArmy Run Tests
description: Triggers a TesterArmy group webhook, waits for all runs to finish, and summarizes the results.

inputs:
  api_key:
    description: TesterArmy API key.
    required: true
  webhook_url:
    description: TesterArmy group webhook URL.
    required: true
  website_url:
    description: Optional website URL override sent as targetUrl in the webhook payload.
    required: false
  app_id:
    description: Optional uploaded TesterArmy app ID for a mobile override.
    required: false
  poll_interval_seconds:
    description: Polling interval in seconds while waiting for run completion.
    required: false
    default: "10"
  timeout_seconds:
    description: Maximum wait time in seconds before timing out.
    required: false
    default: "1800"

outputs:
  run_ids:
    description: JSON array of TesterArmy run IDs created by the webhook.
    value: ${{ steps.run.outputs.run_ids }}
  overall_status:
    description: Overall status of the webhook batch.
    value: ${{ steps.run.outputs.overall_status }}

runs:
  using: composite
  steps:
    - id: run
      name: Run tests
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TESTERARMY_API_KEY: ${{ inputs.api_key }}
        TESTERARMY_WEBHOOK_URL: ${{ inputs.webhook_url }}
        TESTERARMY_WEBSITE_URL: ${{ inputs.website_url }}
        TESTERARMY_APP_ID: ${{ inputs.app_id }}
        TESTERARMY_COMMIT_SHA: ${{ github.sha }}
        POLL_INTERVAL_SECONDS: ${{ inputs.poll_interval_seconds }}
        TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
      run: node --experimental-strip-types "$ACTION_PATH/run-tests.ts"
