name: TesterArmy Mobile CI
description: Uploads a mobile app to TesterArmy, runs the webhook batch, waits for completion, and optionally deletes the uploaded app.

inputs:
  app_path:
    description: Path to the app build file or directory to upload.
    required: true
  api_key:
    description: TesterArmy API key.
    required: true
  project_id:
    description: TesterArmy project ID.
    required: true
  webhook_url:
    description: TesterArmy group webhook URL.
    required: true
  delete_app_after_run:
    description: Delete the uploaded app after the run finishes, even when tests fail.
    required: false
    default: "true"
  remove_after:
    description: Time in seconds after which TesterArmy should remove the upload.
    required: false
    default: "3600"
  poll_interval_seconds:
    description: Polling interval in seconds while waiting for run completion.
    required: false
    default: "10"
  timeout_seconds:
    description: Maximum wait time in seconds before timing out.
    required: false
    default: "1800"

outputs:
  app_id:
    description: Uploaded TesterArmy app ID.
    value: ${{ steps.upload.outputs.app_id }}
  run_ids:
    description: JSON array of TesterArmy run IDs created by the webhook.
    value: ${{ steps.run.outputs.run_ids }}
  overall_status:
    description: Overall status of the webhook batch.
    value: ${{ steps.run.outputs.overall_status }}

runs:
  using: composite
  steps:
    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - id: upload
      name: Upload mobile app
      uses: ./.github/actions/testerarmy-upload-app
      with:
        app_path: ${{ inputs.app_path }}
        api_key: ${{ inputs.api_key }}
        project_id: ${{ inputs.project_id }}
        remove_after: ${{ inputs.remove_after }}

    - id: run
      name: Run mobile tests
      uses: ./.github/actions/testerarmy-run-tests
      with:
        api_key: ${{ inputs.api_key }}
        webhook_url: ${{ inputs.webhook_url }}
        app_id: ${{ steps.upload.outputs.app_id }}
        poll_interval_seconds: ${{ inputs.poll_interval_seconds }}
        timeout_seconds: ${{ inputs.timeout_seconds }}

    - name: Delete uploaded mobile app
      if: ${{ always() && inputs.delete_app_after_run == 'true' && steps.upload.outputs.app_id != '' }}
      uses: ./.github/actions/testerarmy-delete-app
      with:
        api_key: ${{ inputs.api_key }}
        project_id: ${{ inputs.project_id }}
        webhook_url: ${{ inputs.webhook_url }}
        app_id: ${{ steps.upload.outputs.app_id }}
